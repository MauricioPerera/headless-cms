<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}} | {{siteName}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonicalUrl}}">
  <!-- hreflang alternates -->
  <link rel="alternate" hreflang="{{locale}}" href="{{canonicalUrl}}">
  <link rel="alternate" hreflang="x-default" href="{{defaultUrl}}">
  <meta property="og:title" content="{{ogTitle}}">
  <meta property="og:description" content="{{ogDescription}}">
  <meta property="og:url" content="{{canonicalUrl}}">
  <meta property="og:image" content="{{ogImage}}">
  <meta property="og:type" content="{{ogType}}">
  <meta property="og:site_name" content="{{siteName}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ogTitle}}">
  <meta name="twitter:description" content="{{ogDescription}}">
  <meta name="twitter:image" content="{{ogImage}}">
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="{{basePath}}assets/manifest.json">
  <link rel="stylesheet" href="{{basePath}}assets/style.css">
  {{#schemaJson}}
  <script type="application/ld+json">{{schemaJson}}</script>
  {{/schemaJson}}
  <link rel="alternate" type="application/rss+xml" title="{{siteName}}" href="{{basePath}}feed.xml">
  <script>
    (function() {
      const saved = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) {
        document.documentElement.classList.add('theme-dark');
      }
    })();
  </script>
  <meta property="og:locale" content="{{locale}}">
  <style>
    .lang-switch { display:flex; gap:.35rem; margin-left:auto; font-size:.8rem; }
    .lang-switch a { padding:.15rem .4rem; border-radius:.25rem; color:var(--muted); text-decoration:none; }
    .lang-switch a:hover { color:var(--accent); }
    .lang-switch a.active { background:var(--accent); color:#fff; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="site-title" href="{{basePath}}">{{siteName}}</a>
      <nav class="site-nav">
        <a href="{{basePath}}">Inicio</a>
        {{#pages}}
        <a href="{{basePath}}{{slug}}.html">{{title}}</a>
        {{/pages}}
        <a href="{{basePath}}categories/">Categorias</a>
        <a href="{{basePath}}tags/">Tags</a>
        <input type="search" id="site-search" placeholder="Buscar..." class="search-input">
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
          <span id="theme-icon"></span>
        </button>
            </nav>
      <div class="lang-switch">
        <a href="/" class="{{langClassEs}}">ES</a>
        <a href="/en/" class="{{langClassEn}}">EN</a>
      </div>
    </div>
  </header></header>

  <nav class="breadcrumbs" aria-label="Breadcrumb">
    <ol itemscope itemtype="https://schema.org/BreadcrumbList">
      <li itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
        <a itemprop="item" href="{{basePath}}"><span itemprop="name">Inicio</span></a>
        <meta itemprop="position" content="1">
      </li>
      {{#breadcrumb}}
      <li itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
        <a itemprop="item" href="{{url}}"><span itemprop="name">{{name}}</span></a>
        <meta itemprop="position" content="{{position}}">
      </li>
      {{/breadcrumb}}
    </ol>
  </nav>
  <main class="container">
    {{content}}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>{{siteName}} — Generado con Headless CMS</p>
    </div>
  </footer>

  <script src="{{basePath}}assets/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('{{basePath}}service-worker.js')
      .then(() => console.log('[PWA] Service Worker registrado'))
      .catch((err) => console.warn('[PWA] Fallo registro SW:', err));
  }
</script>
</body>
</html>
