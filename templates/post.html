<article class="post">
  {{#featuredImage}}
  <figure class="featured-image">
    <img src="{{src}}" alt="{{alt}}">
    {{#caption}}<figcaption>{{caption}}</figcaption>{{/caption}}
  </figure>
{{/featuredImage}}

  <header class="post-header">
    <h1>{{title}}</h1>
    <div class="post-meta">
      <time datetime="{{publishedAt}}">{{publishedDate}}</time>
      {{#author}}
      <span class="author">por {{displayName}}</span>
      {{/author}}
      <span class="read-time">{{readTime}} min lectura</span>
    </div>
    {{#categories}}
    <div class="post-tags">
      <a class="tag category" href="{{basePath}}categories/{{slug}}.html">{{name}}</a>
    </div>
    {{/categories}}
    {{#tags}}
    <div class="post-tags">
      <a class="tag" href="{{basePath}}tags/{{slug}}.html">{{name}}</a>
    </div>
    {{/tags}}
  </header>

  <div class="post-content">
    {{content}}
  </div>
  {{#author}}
  <footer class="author-card">
    {{#avatar}}<img class="author-avatar" src="{{avatar}}" alt="{{displayName}}">{{/avatar}}
    <div class="author-info">
      <div class="author-name">{{displayName}}</div>
      <p class="author-bio">{{bio}}</p>
    </div>
  </footer>
  {{/author}}
</article>
