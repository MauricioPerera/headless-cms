<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Headless CMS</title>
<style>
  :root { --bg:#fff; --text:#1a1a1a; --muted:#666; --accent:#2563eb; --accenth:#1d4ed8; --surface:#f8f9fa; --border:#e5e7eb; --radius:6px; --max:900px; --gap:1.5rem; }
  html.theme-dark { --bg:#0f0f11; --text:#e6e6e8; --muted:#9ca3af; --accent:#60a5fa; --accenth:#93c5fd; --surface:#18181b; --border:#27272a; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }
  .container { max-width:var(--max); margin:0 auto; padding:0 var(--gap); }
  header { border-bottom:1px solid var(--border); padding:1rem 0; position:sticky; top:0; background:var(--bg); z-index:10; }
  header .container { display:flex; align-items:center; justify-content:space-between; }
  h1 { font-size:1.25rem; margin:0; }
  .btn { display:inline-flex; align-items:center; gap:.4rem; padding:.5rem .9rem; border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:var(--radius); font-size:.9rem; cursor:pointer; text-decoration:none; }
  .btn-primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn-primary:hover { background:var(--accenth); }
  .btn-sm { padding:.3rem .6rem; font-size:.8rem; }
  .form-group { margin-bottom:1rem; }
  label { display:block; font-size:.85rem; font-weight:500; margin-bottom:.35rem; color:var(--muted); }
  input[type="text"], input[type="url"], textarea, select { width:100%; padding:.5rem .6rem; border:1px solid var(--border); border-radius:var(--radius); background:var(--bg); color:var(--text); font-size:.95rem; }
  textarea { min-height:80px; resize:vertical; }
  .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
  @media(max-width:600px){ .grid-2 { grid-template-columns:1fr; } }
  .login-box { max-width:360px; margin:10vh auto; padding:2rem; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); }
  .login-box h2 { margin-top:0; }
  .msg { padding:.6rem .8rem; border-radius:var(--radius); font-size:.85rem; margin-bottom:1rem; }
  .msg-ok { background:#dcfce7; color:#166534; }
  .msg-err { background:#fee2e2; color:#991b1b; }
  .post-list { display:grid; gap:.75rem; }
  .post-item { display:flex; align-items:center; justify-content:space-between; padding:.75rem; border:1px solid var(--border); border-radius:var(--radius); }
  .post-item .title { font-weight:500; }
  .post-item .meta { font-size:.8rem; color:var(--muted); }
  .badge { display:inline-block; padding:.15rem .45rem; border-radius:999px; font-size:.75rem; font-weight:500; background:rgba(37,99,235,.1); color:var(--accent); }
  .badge-draft { background:rgba(100,100,100,.1); color:var(--muted); }
  .hidden { display:none !important; }
  .block-editor { border:1px solid var(--border); border-radius:var(--radius); padding:1rem; background:var(--surface); }
  .block { padding:.6rem; border:1px dashed var(--border); border-radius:var(--radius); margin-bottom:.5rem; background:var(--bg); }
  .block-header { display:flex; gap:.5rem; margin-bottom:.4rem; }
  .block-header select { width:auto; }
  .block-actions { margin-left:auto; display:flex; gap:.3rem; }
  .dropzone { border:2px dashed var(--border); border-radius:var(--radius); padding:1.5rem; text-align:center; color:var(--muted); cursor:pointer; transition:border-color .15s; }
  .dropzone:hover, .dropzone.dragover { border-color:var(--accent); }
  .image-preview { max-width:100%; max-height:200px; border-radius:var(--radius); margin-top:.5rem; }
  .tag-select { display:flex; flex-wrap:wrap; gap:.5rem; margin-top:.4rem; }
  .tag-select label { display:flex; align-items:center; gap:.25rem; font-size:.85rem; font-weight:400; color:var(--text); cursor:pointer; padding:.25rem .5rem; border:1px solid var(--border); border-radius:var(--radius); }
  .tag-select input { accent-color:var(--accent); }
  .tag-select label.checked { border-color:var(--accent); background:rgba(37,99,235,.08); }
  .tabs { display:flex; gap:.5rem; margin-bottom:1rem; border-bottom:1px solid var(--border); }
  .tab { padding:.4rem .8rem; font-size:.9rem; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tab.active { border-bottom-color:var(--accent); color:var(--accent); font-weight:500; }
  .toast { position:fixed; bottom:1rem; right:1rem; padding:.75rem 1rem; border-radius:.5rem; color:#fff; font-size:.9rem; z-index:9999; animation:fadeIn .3s ease; max-width:320px; }
  .toast-success { background:#10b981; }
  .toast-warning { background:#f59e0b; }
  .toast-error { background:#ef4444; }
  .toast-info { background:#3b82f6; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  .offline-banner { display:none; background:#f59e0b; color:#fff; text-align:center; padding:.5rem; font-size:.85rem; }
  .sync-status { font-size:.75rem; color:#94a3b8; white-space:nowrap; }
  button:disabled { opacity:.6; cursor:not-allowed; }
  .spinner { display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.3); border-radius:50%; border-top-color:#fff; animation:spin .8s linear infinite; margin-left:.35rem; vertical-align:middle; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="offline-banner" id="offlineBanner">Sin conexion — los cambios se guardaran en cola y se sincronizaran al reconectar</div>
<div id="toastBox" style="position:fixed;bottom:1rem;right:1rem;z-index:9999;display:flex;flex-direction:column;gap:.5rem;align-items:flex-end;"></div>
<div id="app"></div>

<script>
const API = location.origin;
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => Array.from(el.querySelectorAll(s));

let token = localStorage.getItem('cms_token');
let user = JSON.parse(localStorage.getItem('cms_user') || 'null');
let hasUnsavedChanges = false;
let autoSaveTimer = null;

// ---------- Toast ----------
function showToast(msg, type='success') {
  const box = $('#toastBox');
  const t = document.createElement('div');
  t.className = 'toast toast-' + type;
  t.textContent = msg;
  box.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

// ---------- API with timeout + retry ----------
async function api(path, opts={}) {
  const url = API + '/api' + path;
  const MAX_RETRIES = 3;
  let lastErr;
  for (let attempt = 1; attempt <= MAX_RETRIES; attempt++) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 15000);
    try {
      const res = await fetch(url, {
        signal: controller.signal,
        ...opts,
        headers: {
          'Authorization': 'Bearer ' + token,
          ...(opts.body && !(opts.body instanceof FormData) ? { 'Content-Type': 'application/json' } : {}),
          ...opts.headers,
        },
      });
      clearTimeout(timer);
      if (res.status === 401) { logout(); throw new Error('Sesion expirada'); }
      if (!res.ok) {
        const e = await res.json().catch(() => ({}));
        throw new Error(e.error || 'Error ' + res.status);
      }
      return res.json().catch(() => null);
    } catch (err) {
      clearTimeout(timer);
      lastErr = err.name === 'AbortError' ? new Error('Timeout: sin respuesta del servidor') : err;
      if (lastErr.message === 'Sesion expirada') throw lastErr;
      if (attempt === MAX_RETRIES) throw lastErr;
      await new Promise(r => setTimeout(r, 500 * attempt));
    }
  }
  throw lastErr;
}

function logout() {
  token = null; user = null;
  localStorage.removeItem('cms_token');
  localStorage.removeItem('cms_user');
  stopAutoSave(); markClean();
  renderLogin();
}

// ---------- Offline detection ----------
const offlineBanner = document.getElementById('offlineBanner');
window.addEventListener('offline', () => { offlineBanner.style.display = 'block'; });
window.addEventListener('online', () => { offlineBanner.style.display = 'none'; flushOfflineQueue(); });

const OFFLINE_QUEUE_KEY = 'cms_offline_queue';

function enqueueOffline(entry) {
  const q = JSON.parse(localStorage.getItem(OFFLINE_QUEUE_KEY) || '[]');
  q.push({ ...entry, queuedAt: new Date().toISOString() });
  localStorage.setItem(OFFLINE_QUEUE_KEY, JSON.stringify(q));
  markClean();
  showToast('Sin conexion — guardado en cola local', 'warning');
}

async function flushOfflineQueue() {
  const q = JSON.parse(localStorage.getItem(OFFLINE_QUEUE_KEY) || '[]');
  if (!q.length) return;
  showToast('Sincronizando ' + q.length + ' cambio(s) pendiente(s)...', 'info');
  const failed = [];
  for (const entry of q) {
    try { await api(entry.path, entry.opts); }
    catch { failed.push(entry); }
  }
  if (failed.length) {
    localStorage.setItem(OFFLINE_QUEUE_KEY, JSON.stringify(failed));
    showToast(failed.length + ' cambio(s) no sincronizados', 'error');
  } else {
    localStorage.removeItem(OFFLINE_QUEUE_KEY);
    showToast('Todos los cambios sincronizados', 'success');
  }
}

// ---------- Auto-save ----------
function startAutoSave(getPayload, draftKey) {
  clearInterval(autoSaveTimer);
  autoSaveTimer = setInterval(() => {
    try {
      const data = getPayload();
      if (!data || !data.title) return;
      localStorage.setItem(draftKey, JSON.stringify(data));
    } catch {}
  }, 30000);
}

function stopAutoSave() { clearInterval(autoSaveTimer); autoSaveTimer = null; }

function recoverDraft(draftKey) {
  try { return JSON.parse(localStorage.getItem(draftKey) || 'null'); }
  catch { return null; }
}

function clearDraft(draftKey) { localStorage.removeItem(draftKey); }

// ---------- Dirty tracking ----------
function markDirty() { hasUnsavedChanges = true; }
function markClean() { hasUnsavedChanges = false; }

// ---------- Last synced ----------
function updateLastSynced() {
  const el = document.getElementById('lastSynced');
  if (el) el.textContent = 'Guardado ' + new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
}

// ---------- Beforeunload ----------
window.addEventListener('beforeunload', e => {
  if (hasUnsavedChanges) { e.preventDefault(); e.returnValue = ''; }
});

// ---------- Login ----------
function renderLogin(msg='') {
  stopAutoSave(); markClean();
  $('#app').innerHTML = `
    <div class="login-box">
      <h2>Admin CMS</h2>
      ${msg ? `<div class="msg msg-err">${escapeHtml(msg)}</div>` : ''}
      <div class="form-group"><label>Usuario</label><input type="text" id="u" autocomplete="username"></div>
      <div class="form-group"><label>Contrasena</label><input type="password" id="p" autocomplete="current-password"></div>
      <button class="btn btn-primary" id="btn" style="width:100%">Entrar</button>
    </div>`;
  const btn = $('#btn');
  const doLogin = async () => {
    const u = $('#u').value.trim(), p = $('#p').value;
    if (!u || !p) return;
    btn.disabled = true; btn.textContent = 'Entrando...';
    try {
      const r = await fetch(API + '/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p }),
      });
      if (!r.ok) throw new Error('Credenciales invalidas');
      const d = await r.json();
      token = d.token; user = d.user;
      localStorage.setItem('cms_token', token);
      localStorage.setItem('cms_user', JSON.stringify(user));
      renderDashboard();
    } catch (e) { btn.disabled = false; btn.textContent = 'Entrar'; renderLogin(e.message); }
  };
  btn.onclick = doLogin;
  $('#p').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
}

// ---------- Dashboard ----------
async function renderDashboard() {
  stopAutoSave(); markClean();
  $('#app').innerHTML = `
    <header>
      <div class="container">
        <h1>Headless CMS</h1>
        <div style="display:flex;align-items:center;gap:.75rem;flex-wrap:wrap">
          <span id="lastSynced" class="sync-status"></span>
          <span style="color:var(--muted);font-size:.9rem">${escapeHtml(user.displayName || user.username)}</span>
          <button class="btn btn-sm" id="new">+ Nuevo</button>
          <button class="btn btn-sm" id="out">Salir</button>
        </div>
      </div>
    </header>
    <div class="container" style="padding-top:1.5rem">
      <div class="tabs">
        <div class="tab active" data-tab="posts">Posts</div>
        <div class="tab" data-tab="pages">Paginas</div>
      </div>
      <div id="list" class="post-list"></div>
    </div>`;
  $('#new').onclick = () => {
    const tab = $('.tab.active')?.dataset?.tab;
    if (tab === 'pages') renderPageEditor(); else renderEditor();
  };
  $('#out').onclick = logout;
  $$('[data-tab]').forEach(t => t.onclick = () => {
    $$('[data-tab]').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    if (t.dataset.tab === 'pages') renderPageList(); else renderPostList();
  });
  renderPostList();
}

// ---------- Lists ----------
let currentPost = null;
let blocks = [];
let taxonomies = [];

async function renderPostList() {
  const list = $('#list');
  list.innerHTML = '<p style="color:var(--muted)">Cargando...</p>';
  try {
    const data = await api('/posts?limit=50&sort=createdAt:desc');
    const posts = Array.isArray(data) ? data : (data.posts || []);
    if (!posts.length) { list.innerHTML = '<p style="color:var(--muted)">No hay posts.</p>'; return; }
    list.innerHTML = posts.map(p => `
      <div class="post-item">
        <div>
          <div class="title">${escapeHtml(p.title)} <span class="badge ${p.status === 'published' ? '' : 'badge-draft'}">${p.status}</span>${p.locale && p.locale !== 'es' ? ' <span class="badge badge-draft">' + p.locale + '</span>' : ''}</div>
          <div class="meta">${fmtDate(p.createdAt)}${p.meta?.readTime ? ' · ' + p.meta.readTime + ' min' : ''}</div>
        </div>
        <div style="display:flex;gap:.5rem">
          <button class="btn btn-sm" data-edit="${p._id}">Editar</button>
          <button class="btn btn-sm" data-del="${p._id}">Eliminar</button>
        </div>
      </div>`).join('');
    $$('[data-edit]').forEach(b => b.onclick = () => renderEditor(b.dataset.edit));
    $$('[data-del]').forEach(b => b.onclick = async () => {
      if (!confirm('Eliminar este post?')) return;
      await api('/posts/' + b.dataset.del, { method: 'DELETE' });
      showToast('Post eliminado', 'success');
      renderPostList();
    });
  } catch (e) { list.innerHTML = '<p class="msg msg-err">' + escapeHtml(e.message) + '</p>'; }
}

async function renderPageList() {
  const list = $('#list');
  list.innerHTML = '<p style="color:var(--muted)">Cargando...</p>';
  try {
    const data = await api('/pages?limit=50&sort=createdAt:desc');
    const pages = Array.isArray(data) ? data : (data.pages || []);
    if (!pages.length) { list.innerHTML = '<p style="color:var(--muted)">No hay paginas.</p>'; return; }
    list.innerHTML = pages.map(p => `
      <div class="post-item">
        <div>
          <div class="title">${escapeHtml(p.title)}</div>
          <div class="meta">${fmtDate(p.createdAt)} · /${p.slug}.html</div>
        </div>
        <div style="display:flex;gap:.5rem">
          <button class="btn btn-sm" data-edit-page="${p._id}">Editar</button>
          <button class="btn btn-sm" data-del-page="${p._id}">Eliminar</button>
        </div>
      </div>`).join('');
    $$('[data-edit-page]').forEach(b => b.onclick = () => renderPageEditor(b.dataset.editPage));
    $$('[data-del-page]').forEach(b => b.onclick = async () => {
      if (!confirm('Eliminar esta pagina?')) return;
      await api('/pages/' + b.dataset.delPage, { method: 'DELETE' });
      showToast('Pagina eliminada', 'success');
      renderPageList();
    });
  } catch (e) { list.innerHTML = '<p class="msg msg-err">' + escapeHtml(e.message) + '</p>'; }
}

// ---------- Post editor ----------
async function renderEditor(id) {
  currentPost = null; blocks = []; markClean();
  const draftKey = 'cms_autosave_' + (id || 'new');

  $('#app').innerHTML = `
    <header>
      <div class="container">
        <h1>${id ? 'Editar' : 'Nuevo'} post</h1>
        <div style="display:flex;align-items:center;gap:.5rem;flex-wrap:wrap">
          <span id="lastSynced" class="sync-status"></span>
          <button class="btn btn-sm" id="back">← Volver</button>
          <button class="btn btn-primary btn-sm" id="save">Guardar</button>
        </div>
      </div>
    </header>
    <div class="container" style="padding-top:1.5rem">
      <div class="grid-2">
        <div class="form-group"><label>Titulo</label><input type="text" id="title"></div>
        <div class="form-group"><label>Slug (opcional)</label><input type="text" id="slug" placeholder="auto"></div>
      </div>
      <div class="form-group"><label>Extracto</label><textarea id="excerpt"></textarea></div>
      <div class="grid-2">
        <div class="grid-2">
          <div class="form-group"><label>Estado</label>
            <select id="status">
              <option value="draft">Borrador</option>
              <option value="published">Publicado</option>
            </select>
          </div>
          <div class="form-group"><label>Idioma</label>
            <select id="locale">
              <option value="es">es</option>
              <option value="en">en</option>
            </select>
          </div>
        </div>
        <div class="grid-2">
          <div class="form-group"><label>Tiempo de lectura (min)</label><input type="text" id="readTime" placeholder="5"></div>
          <div class="form-group"><label>Imagen destacada (URL)</label><input type="url" id="featuredImage" placeholder="https://..."></div>
        </div>
      </div>
      <div class="form-group"><label>Subir imagen</label>
        <div class="dropzone" id="dropzone">Arrastra una imagen aqui o haz click para seleccionar</div>
        <input type="file" id="fileInput" accept="image/*" style="display:none">
        <div id="uploadPreview"></div>
      </div>
      <div class="form-group"><label>Categorias y tags</label><div class="tag-select" id="taxSelect"></div></div>
      <div class="form-group"><label>Contenido</label>
        <div class="block-editor" id="editor"></div>
        <div style="margin-top:.5rem;display:flex;gap:.5rem;flex-wrap:wrap">
          <button class="btn btn-sm" data-add="paragraph">+ Parrafo</button>
          <button class="btn btn-sm" data-add="heading">+ H2</button>
          <button class="btn btn-sm" data-add="heading3">+ H3</button>
          <button class="btn btn-sm" data-add="image">+ Imagen</button>
          <button class="btn btn-sm" data-add="code">+ Code</button>
          <button class="btn btn-sm" data-add="quote">+ Cita</button>
          <button class="btn btn-sm" data-add="list">+ Lista</button>
          <button class="btn btn-sm" data-add="divider">+ Divisor</button>
        </div>
      </div>
    </div>`;

  // Load taxonomies
  try { const d = await api('/taxonomies?limit=100'); taxonomies = Array.isArray(d) ? d : (d.taxonomies || []); }
  catch { taxonomies = []; }
  const taxSelect = $('#taxSelect');
  const cats = taxonomies.filter(t => t.type === 'category');
  const tags = taxonomies.filter(t => t.type === 'tag');
  taxSelect.innerHTML = [
    ...cats.map(t => `<label><input type="checkbox" value="${t._id}"> ${escapeHtml(t.name)}</label>`),
    ...tags.map(t => `<label><input type="checkbox" value="${t._id}"> ${escapeHtml(t.name)}</label>`),
  ].join('');
  taxSelect.querySelectorAll('input').forEach(ch => {
    ch.onchange = () => { ch.parentElement.classList.toggle('checked', ch.checked); markDirty(); };
  });

  // Load existing post
  if (id) {
    try {
      const p = await api('/posts/' + id + '?withAuthor=true&withTaxonomies=true');
      currentPost = p;
      $('#title').value = p.title || '';
      $('#slug').value = p.slug || '';
      $('#excerpt').value = p.excerpt || '';
      $('#status').value = p.status || 'draft';
      $('#locale').value = p.locale || 'es';
      $('#readTime').value = p.meta?.readTime || '';
      $('#featuredImage').value = typeof p.featuredImage === 'string' ? p.featuredImage : (p.featuredImage?.src || '');
      const tids = p.taxonomyIds || [];
      taxSelect.querySelectorAll('input').forEach(ch => {
        ch.checked = tids.includes(ch.value);
        ch.parentElement.classList.toggle('checked', ch.checked);
      });
      try { blocks = typeof p.content === 'string' ? JSON.parse(p.content) : (p.content || []); }
      catch { blocks = []; }
    } catch (e) { showToast(e.message, 'error'); }
  }

  // Recover draft if newer than saved post
  const draft = recoverDraft(draftKey);
  if (draft?.title && draft?.savedAt) {
    const draftDate = new Date(draft.savedAt);
    const postDate = currentPost ? new Date(currentPost.updatedAt) : null;
    if (!postDate || draftDate > postDate) {
      if (confirm('Hay un borrador auto-guardado (' + fmtDate(draft.savedAt) + '). ¿Restaurarlo?')) {
        $('#title').value = draft.title || '';
        if (draft.excerpt !== undefined) $('#excerpt').value = draft.excerpt;
        if (draft.status) $('#status').value = draft.status;
        if (draft.locale) $('#locale').value = draft.locale;
        blocks = draft.blocks || blocks;
        markDirty();
      }
    }
  }

  renderBlocks();

  // Mark dirty on field changes
  ['title', 'slug', 'excerpt', 'status', 'locale', 'readTime', 'featuredImage'].forEach(fid => {
    $('#' + fid)?.addEventListener('input', markDirty);
    $('#' + fid)?.addEventListener('change', markDirty);
  });

  // Auto-save every 30s
  startAutoSave(() => ({
    title: $('#title')?.value?.trim(),
    excerpt: $('#excerpt')?.value?.trim(),
    status: $('#status')?.value,
    locale: $('#locale')?.value,
    blocks: [...blocks],
    savedAt: new Date().toISOString(),
  }), draftKey);

  // Navigation guard
  $('#back').onclick = () => {
    if (hasUnsavedChanges && !confirm('Tienes cambios sin guardar. ¿Salir de todas formas?')) return;
    stopAutoSave(); markClean(); renderDashboard();
  };

  // Save button
  $('#save').onclick = async () => {
    const btn = $('#save');
    btn.disabled = true;
    btn.innerHTML = 'Guardando<span class="spinner"></span>';
    try { await savePost(draftKey); }
    catch (e) { showToast(e.message, 'error'); }
    finally { btn.disabled = false; btn.innerHTML = 'Guardar'; }
  };

  $$('[data-add]').forEach(b => b.onclick = () => addBlock(b.dataset.add));

  // Image upload
  const dropzone = $('#dropzone');
  const fileInput = $('#fileInput');
  dropzone.onclick = () => fileInput.click();
  fileInput.onchange = () => { if (fileInput.files[0]) uploadFile(fileInput.files[0]); };
  dropzone.ondragover = e => { e.preventDefault(); dropzone.classList.add('dragover'); };
  dropzone.ondragleave = () => dropzone.classList.remove('dragover');
  dropzone.ondrop = e => {
    e.preventDefault(); dropzone.classList.remove('dragover');
    const f = e.dataTransfer.files[0]; if (f) uploadFile(f);
  };
}

// ---------- Blocks ----------
function renderBlocks() {
  const editor = $('#editor');
  if (!editor) return;
  if (!blocks.length) {
    editor.innerHTML = '<p style="color:var(--muted)">Sin bloques. Agrega contenido arriba.</p>';
    return;
  }
  editor.innerHTML = blocks.map((b, i) => `
    <div class="block" data-i="${i}">
      <div class="block-header">
        <select onchange="changeType(${i}, this.value)">
          <option value="paragraph" ${b.type === 'paragraph' ? 'selected' : ''}>Parrafo</option>
          <option value="heading" ${b.type === 'heading' ? 'selected' : ''}>H2</option>
          <option value="heading3" ${b.type === 'heading3' ? 'selected' : ''}>H3</option>
          <option value="image" ${b.type === 'image' ? 'selected' : ''}>Imagen</option>
          <option value="code" ${b.type === 'code' ? 'selected' : ''}>Code</option>
          <option value="quote" ${b.type === 'quote' ? 'selected' : ''}>Cita</option>
          <option value="list" ${b.type === 'list' ? 'selected' : ''}>Lista</option>
          <option value="divider" ${b.type === 'divider' ? 'selected' : ''}>Divisor</option>
        </select>
        <div class="block-actions">
          <button class="btn btn-sm" onclick="moveBlock(${i},-1)">↑</button>
          <button class="btn btn-sm" onclick="moveBlock(${i},1)">↓</button>
          <button class="btn btn-sm" onclick="removeBlock(${i})">×</button>
        </div>
      </div>
      ${blockFields(b, i)}
    </div>`).join('');
}

function blockFields(b, i) {
  switch (b.type) {
    case 'paragraph':
      return `<textarea oninput="blocks[${i}].text=this.value;markDirty()" placeholder="Texto...">${escapeHtml(b.text || '')}</textarea>`;
    case 'heading':
      return `<input type="text" oninput="blocks[${i}].text=this.value;markDirty()" placeholder="Titulo H2..." value="${escapeHtml(b.text || '')}">`;
    case 'heading3':
      return `<input type="text" oninput="blocks[${i}].text=this.value;markDirty()" placeholder="Subtitulo H3..." value="${escapeHtml(b.text || '')}">`;
    case 'image':
      return `<input type="url" oninput="blocks[${i}].src=this.value;markDirty()" placeholder="URL imagen..." value="${escapeHtml(b.src || '')}">
              <input type="text" oninput="blocks[${i}].alt=this.value;markDirty()" placeholder="Alt text..." value="${escapeHtml(b.alt || '')}" style="margin-top:.4rem">`;
    case 'code':
      return `<textarea oninput="blocks[${i}].text=this.value;markDirty()" placeholder="Codigo..." style="font-family:monospace">${escapeHtml(b.text || '')}</textarea>`;
    case 'quote':
      return `<textarea oninput="blocks[${i}].text=this.value;markDirty()" placeholder="Cita...">${escapeHtml(b.text || '')}</textarea>`;
    case 'list':
      return `<label style="font-size:.8rem;display:flex;align-items:center;gap:.4rem;margin-bottom:.4rem">
                <input type="checkbox" ${b.ordered ? 'checked' : ''} onchange="blocks[${i}].ordered=this.checked;markDirty()"> Ordenada
              </label>
              <textarea oninput="blocks[${i}].items=this.value.split('\\n');markDirty()" placeholder="Items (uno por linea)...">${escapeHtml((b.items || []).join('\n'))}</textarea>`;
    case 'divider':
      return '<em style="color:var(--muted);font-size:.85rem">Divisor horizontal</em>';
    default:
      return '';
  }
}

function addBlock(type) {
  const base = { type };
  if (['paragraph', 'heading', 'heading3', 'code', 'quote'].includes(type)) base.text = '';
  if (type === 'image') { base.src = ''; base.alt = ''; }
  if (type === 'list') { base.items = []; base.ordered = false; }
  blocks.push(base);
  markDirty();
  renderBlocks();
}

function changeType(i, type) {
  blocks[i] = { type };
  if (type !== 'divider') blocks[i].text = '';
  markDirty(); renderBlocks();
}

function moveBlock(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= blocks.length) return;
  [blocks[i], blocks[j]] = [blocks[j], blocks[i]];
  markDirty(); renderBlocks();
}

function removeBlock(i) {
  blocks.splice(i, 1);
  markDirty(); renderBlocks();
}

// ---------- Upload ----------
async function uploadFile(file) {
  const preview = $('#uploadPreview');
  if (!preview) return;
  preview.innerHTML = '<p style="color:var(--muted)">Subiendo...</p>';
  const form = new FormData();
  form.append('image', file);
  try {
    const r = await fetch(API + '/api/upload', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token },
      body: form,
    });
    if (!r.ok) throw new Error('Error al subir');
    const d = await r.json();
    if ($('#featuredImage')) $('#featuredImage').value = d.url;
    preview.innerHTML = `<img class="image-preview" src="${d.url}" alt="preview">`;
    markDirty();
  } catch (e) { preview.innerHTML = '<p class="msg msg-err">' + escapeHtml(e.message) + '</p>'; }
}

// ---------- Page editor ----------
async function renderPageEditor(id) {
  currentPost = null; blocks = []; markClean();
  const draftKey = 'cms_autosave_page_' + (id || 'new');

  $('#app').innerHTML = `
    <header>
      <div class="container">
        <h1>${id ? 'Editar' : 'Nueva'} pagina</h1>
        <div style="display:flex;align-items:center;gap:.5rem;flex-wrap:wrap">
          <span id="lastSynced" class="sync-status"></span>
          <button class="btn btn-sm" id="back">← Volver</button>
          <button class="btn btn-primary btn-sm" id="save">Guardar</button>
        </div>
      </div>
    </header>
    <div class="container" style="padding-top:1.5rem">
      <div class="grid-2">
        <div class="form-group"><label>Titulo</label><input type="text" id="title"></div>
        <div class="form-group"><label>Slug</label><input type="text" id="slug" placeholder="auto"></div>
      </div>
      <div class="form-group"><label>Extracto</label><textarea id="excerpt"></textarea></div>
      <div class="form-group"><label>Contenido</label>
        <div class="block-editor" id="editor"></div>
        <div style="margin-top:.5rem;display:flex;gap:.5rem;flex-wrap:wrap">
          <button class="btn btn-sm" data-add="paragraph">+ Parrafo</button>
          <button class="btn btn-sm" data-add="heading">+ H2</button>
          <button class="btn btn-sm" data-add="heading3">+ H3</button>
          <button class="btn btn-sm" data-add="image">+ Imagen</button>
          <button class="btn btn-sm" data-add="code">+ Code</button>
          <button class="btn btn-sm" data-add="quote">+ Cita</button>
          <button class="btn btn-sm" data-add="list">+ Lista</button>
          <button class="btn btn-sm" data-add="divider">+ Divisor</button>
        </div>
      </div>
    </div>`;

  if (id) {
    try {
      const p = await api('/pages/' + id);
      currentPost = p;
      $('#title').value = p.title || '';
      $('#slug').value = p.slug || '';
      $('#excerpt').value = p.excerpt || '';
      try { blocks = typeof p.content === 'string' ? JSON.parse(p.content) : (p.content || []); }
      catch { blocks = []; }
    } catch (e) { showToast(e.message, 'error'); }
  }

  const draft = recoverDraft(draftKey);
  if (draft?.title && draft?.savedAt) {
    const draftDate = new Date(draft.savedAt);
    const pageDate = currentPost ? new Date(currentPost.updatedAt) : null;
    if (!pageDate || draftDate > pageDate) {
      if (confirm('Hay un borrador auto-guardado. ¿Restaurarlo?')) {
        $('#title').value = draft.title || '';
        if (draft.excerpt !== undefined) $('#excerpt').value = draft.excerpt;
        blocks = draft.blocks || blocks;
        markDirty();
      }
    }
  }

  renderBlocks();

  ['title', 'slug', 'excerpt'].forEach(fid => {
    $('#' + fid)?.addEventListener('input', markDirty);
  });

  startAutoSave(() => ({
    title: $('#title')?.value?.trim(),
    excerpt: $('#excerpt')?.value?.trim(),
    blocks: [...blocks],
    savedAt: new Date().toISOString(),
  }), draftKey);

  $('#back').onclick = () => {
    if (hasUnsavedChanges && !confirm('Tienes cambios sin guardar. ¿Salir de todas formas?')) return;
    stopAutoSave(); markClean(); renderDashboard();
  };
  $('#save').onclick = async () => {
    const btn = $('#save');
    btn.disabled = true;
    btn.innerHTML = 'Guardando<span class="spinner"></span>';
    try { await savePage(draftKey); }
    catch (e) { showToast(e.message, 'error'); }
    finally { btn.disabled = false; btn.innerHTML = 'Guardar'; }
  };
  $$('[data-add]').forEach(b => b.onclick = () => addBlock(b.dataset.add));
}

// ---------- Save ----------
async function savePage(draftKey) {
  const title = $('#title').value.trim();
  if (!title) { showToast('Titulo requerido', 'error'); return; }
  const slug = $('#slug').value.trim() || undefined;
  const excerpt = $('#excerpt').value.trim();
  const payload = { title, content: JSON.stringify(blocks), excerpt };
  if (slug) payload.slug = slug;

  const path = currentPost ? '/pages/' + currentPost._id : '/pages';
  const method = currentPost ? 'PATCH' : 'POST';

  if (!navigator.onLine) {
    enqueueOffline({ path, opts: { method, body: JSON.stringify(payload) } });
    return;
  }

  await api(path, { method, body: JSON.stringify(payload) });
  markClean();
  clearDraft(draftKey);
  updateLastSynced();
  showToast('Pagina guardada', 'success');
  stopAutoSave();
  setTimeout(renderDashboard, 700);
}

async function savePost(draftKey) {
  const title = $('#title').value.trim();
  if (!title) { showToast('Titulo requerido', 'error'); return; }
  const slug = $('#slug').value.trim() || undefined;
  const excerpt = $('#excerpt').value.trim();
  const status = $('#status').value;
  const locale = $('#locale').value;
  const readTime = parseInt($('#readTime').value, 10) || undefined;
  const featuredImage = $('#featuredImage').value.trim() || undefined;
  const taxonomyIds = $$('#taxSelect input:checked').map(ch => ch.value);
  const payload = { title, content: JSON.stringify(blocks), excerpt, status, locale, taxonomyIds };
  if (slug) payload.slug = slug;
  if (readTime) payload.meta = { readTime };
  if (featuredImage) payload.featuredImage = featuredImage;

  const path = currentPost ? '/posts/' + currentPost._id : '/posts';
  const method = currentPost ? 'PATCH' : 'POST';

  if (!navigator.onLine) {
    enqueueOffline({ path, opts: { method, body: JSON.stringify(payload) } });
    return;
  }

  await api(path, { method, body: JSON.stringify(payload) });
  markClean();
  clearDraft(draftKey);
  updateLastSynced();
  showToast('Post guardado', 'success');
  stopAutoSave();
  setTimeout(renderDashboard, 700);
}

// ---------- Helpers ----------
function escapeHtml(t) {
  return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function fmtDate(iso) {
  if (!iso) return '';
  try { return new Date(iso).toLocaleDateString('es-MX', { year: 'numeric', month: 'short', day: 'numeric' }); }
  catch { return iso; }
}

// ---------- Init ----------
if (token && user) renderDashboard(); else renderLogin();
</script>
